name: Validate add-ons

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        addon: [companion, panalapse]
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: ./${{ matrix.addon }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Companion add-on
        run: docker build --pull -t companion-addon-test companion
      - name: Check that Companion launches
        run: |
          mkdir -p "$RUNNER_TEMP/config" "$RUNNER_TEMP/data"
          echo '{"admin_port": 8000}' > "$RUNNER_TEMP/data/options.json"
          docker run -d --name companion-test -p 8000:8000 -p 8099:8099 \
            -e INGRESS_PORT=8099 -e INGRESS_ALLOW=all \
            -v "$RUNNER_TEMP/config:/config" -v "$RUNNER_TEMP/data:/data" \
            companion-addon-test
          for attempt in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8000/; then
              echo "Companion answered on port 8000"
              break
            fi
            sleep 5
          done
          curl -fsS -o /dev/null http://localhost:8000/ || { docker logs companion-test; exit 1; }
          # Through the ingress proxy the page must be rewritten to the ingress path.
          if curl -fsS -H "X-Ingress-Path: /api/hassio_ingress/testtoken" http://localhost:8099/ \
              | grep -q "/api/hassio_ingress/testtoken"; then
            echo "Ingress proxy serves Companion under the ingress path"
          else
            docker logs companion-test
            exit 1
          fi

  build-panalapse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Panalapse add-on
        run: |
          docker build --pull             --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20             -t panalapse-addon-test panalapse
      - name: Check that Panalapse launches
        run: |
          mkdir -p "$RUNNER_TEMP/pdata"
          echo '{"log_level": "debug"}' > "$RUNNER_TEMP/pdata/options.json"
          docker run -d --name panalapse-test -p 8099:8099             -v "$RUNNER_TEMP/pdata:/data" panalapse-addon-test
          for attempt in $(seq 1 20); do
            if curl -fsS -o /dev/null http://localhost:8099/api/state; then
              echo "Panalapse answered on port 8099"
              break
            fi
            sleep 3
          done
          curl -fsS http://localhost:8099/api/state || { docker logs panalapse-test; exit 1; }
          curl -fsS -o /dev/null http://localhost:8099/ || { docker logs panalapse-test; exit 1; }
          docker exec panalapse-test ffmpeg -version | head -1
          docker exec panalapse-test sh -c 'ffmpeg -hide_banner -h demuxer=rtsp | grep -q -- "-timeout" && echo "ffmpeg: rtsp demuxer with -timeout OK"'
          docker exec panalapse-test python3 -c "import PIL, paho.mqtt; print('Pillow', PIL.__version__, 'paho-mqtt', paho.mqtt.__version__)"
          curl -fsS http://localhost:8099/api/state | python3 -c "import sys, json; print('MQTT status:', json.load(sys.stdin)['mqtt']['status'])"
          curl -fsS -X POST http://localhost:8099/api/discover -H 'Content-Type: application/json' -d '{"targets":"127.0.0.1-4"}'
