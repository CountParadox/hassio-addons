# Reverse proxy for Home Assistant ingress.
# Home Assistant sends the ingress base path in X-Ingress-Path; Companion (4.1+)
# serves itself under a sub-path when it gets that path in Companion-custom-prefix.
# %%...%% placeholders are filled in by run.sh.
pid /tmp/nginx-ingress.pid;
error_log stderr warn;
worker_processes 1;

events {
  worker_connections 512;
}

http {
  access_log off;
  client_max_body_size 0;
  client_body_temp_path /tmp/nginx-body;
  proxy_temp_path /tmp/nginx-proxy;
  fastcgi_temp_path /tmp/nginx-fastcgi;
  uwsgi_temp_path /tmp/nginx-uwsgi;
  scgi_temp_path /tmp/nginx-scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # "/api/hassio_ingress/<token>" -> "api/hassio_ingress/<token>"
  map $http_x_ingress_path $companion_prefix {
    default "";
    "~^/(?<ingress_prefix>.+)$" $ingress_prefix;
  }

  server {
    listen %%INGRESS_PORT%%;

    # Only Home Assistant may use this port; everything else uses the admin port.
    allow %%INGRESS_ALLOW%%;
    deny all;

    location / {
      proxy_pass http://127.0.0.1:%%ADMIN_PORT%%;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;

      proxy_set_header Companion-custom-prefix $companion_prefix;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
