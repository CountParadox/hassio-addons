name: Bitfocus Companion
version: "5.1.3"
slug: bitfocus_companion
description: Control broadcast, AV and streaming gear from Stream Decks and web buttons
url: https://github.com/CountParadox/hassio-addons/tree/master/companion
arch:
  - amd64
  - aarch64
init: false
startup: services
boot: auto
# Companion talks to devices with discovery, broadcast and many inbound
# protocols, so it runs on the host network like a native install.
host_network: true
webui: http://[HOST]:[PORT:8000]
watchdog: http://[HOST]:[PORT:8000]/
map:
  - addon_config:rw
options:
  admin_port: 8000
schema:
  admin_port: port
